name: Nightly jobs

# Replaces the Vercel crons, which were killed by the 10s function cap.
# Same UTC schedule as the old vercel.json crons.
on:
  schedule:
    - cron: "30 23 * * *"  # costs
    - cron: "0 0 * * *"    # sync
    - cron: "30 1 * * *"   # pull
    - cron: "30 2 * * *"   # collections
    - cron: "0 3 * * *"    # sweep
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [sync, pull, collections, sweep, costs]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick job
        id: pick
        run: |
          if [ -n "${{ inputs.job }}" ]; then job="${{ inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              "30 23 * * *") job=costs ;;
              "0 0 * * *")   job=sync ;;
              "30 1 * * *")  job=pull ;;
              "30 2 * * *")  job=collections ;;
              "0 3 * * *")   job=sweep ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Run ${{ steps.pick.outputs.job }}
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          FNMARKET_INTERCOM_TOKEN: ${{ secrets.FNMARKET_INTERCOM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://reiacekmluvuguqfswac.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COST_API_URL: ${{ secrets.COST_API_URL }}
          COST_TARGET_KEYS: ${{ secrets.COST_TARGET_KEYS }}
        run: python scripts/run_cron.py ${{ steps.pick.outputs.job }}
